html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background-image:radial-gradient(600px 400px at 85% -5%,var(--ac2),transparent),radial-gradient(500px 360px at -5% 40%,var(--ac2),transparent);background-repeat:no-repeat}
a{color:var(--ac)}
.w{max-width:1000px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);z-index:5}

h3{margin:0 0 6px;font-size:1.05rem}

.hero p{max-width:580px;color:var(--mut)}

.tilt>*{position:relative}
@media (prefers-reduced-motion:reduce){.tilt,.tilt:hover{transform:none;transition:none}}

.sk{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:5px 12px 5px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);margin:0 6px 8px 0;color:var(--tx)}
.sk svg{width:18px;height:18px;flex:none}
.sk:not(:has(svg)){padding-left:12px}
.cf{max-width:560px;margin-bottom:18px;border-radius:14px}

.cf.hl{animation:hl 1.4s ease-out}

.cf label{display:block;font-size:14px;font-weight:600;margin:0 0 4px}

.cf button{border:0;cursor:pointer;font:inherit;font-weight:600}
.cf button:disabled{opacity:.6;cursor:wait}
#cs{min-height:1.6em;margin:10px 0 0;font-size:14px;color:var(--mut)}
.figs{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.figs:empty{display:none}
.fig{margin:0}
.fig img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--bd);background:#fff}
.fig figcaption{font-size:13px;color:var(--mut);margin-top:6px}
.yr{font-size:12px;color:var(--mut);margin-bottom:4px}
.more{font-size:.9rem;font-weight:600;color:var(--ac)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.filters button{font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.tl{border-left:2px solid var(--bd);padding-left:18px;margin-left:6px}
.tl div{margin-bottom:20px}
.tl small{color:var(--mut)}
.back{display:inline-block;margin-top:36px;font-weight:600;text-decoration:none}
.blk{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.blk p{margin:0;color:var(--mut)}
.lk{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
footer{margin-top:64px;padding:28px 0;border-top:1px solid var(--bd);color:var(--mut);font-size:14px}

return '<section><h2>Projets</h2><p class="sub">'+P.length+' projets de BUT 1 et BUT 2. Filtre par année ou par technologie.</p><div class="filters" role="group" aria-label="Filtres">'+F.map(function(x){return '<button aria-pressed="'+(x===cur)+'" data-f="'+x+'">'+x+'</button>'}).join("")+'</div><div class="grid">'+P.filter(function(p){return cur==="Tous"||p[2]===cur||p[7].indexOf(cur)>-1}).map(card).join("")+'</div></section>';

var p=P.filter(function(x){return x[0]===id})[0];
if(!p)return '<section><h2>Projet introuvable</h2><a class="back" href="#/projets">← Tous les projets</a></section>';

return '<section><div class="yr">'+p[2]+'</div><h1 style="font-size:clamp(1.7rem,5vw,2.4rem)">'+p[1]+'</h1><div>'+tags(p[7])+'</div><div style="height:18px"></div>'+

(p[8].length||IMG[p[0]]?'<div class="blk"><h3>Livrables</h3>'+(p[8].length?'<div class="lk">'+p[8].map(function(l){return '<a class="btn o" href="'+(typeof l[1]==="string"?l[1]:B+l[1])+'" target="_blank" rel="noopener">'+l[0]+' ↗</a>'}).join("")+'</div>':'')+figs(p)+'</div>':'')+

function route(){
var h=location.hash.replace(/^#\/?/,""),r=h.split("/");
document.title="Morade OSENI — Portfolio Science des Données";
var key=r[0]==="projets"||r[0]==="projet"?"projets":"home";
app.innerHTML=r[0]==="projets"?list():r[0]==="projet"?detail(r[1]):home();
document.querySelectorAll("nav [data-r]").forEach(function(a){a.classList.toggle("on",a.dataset.r===key)});
if(r[0]==="contact"){goContact()}else window.scrollTo(0,0);
}
function goContact(){
var c=document.getElementById("contact"),f=document.getElementById("cf");
if(!c)return;c.scrollIntoView({behavior:"smooth"});
if(f){f.classList.remove("hl");void f.offsetWidth;f.classList.add("hl")}
}
document.addEventListener("click",function(e){
var a=e.target.closest&&e.target.closest('a[href="#/contact"]');if(!a)return;
var h=location.hash.replace(/^#\/?/,"");
if(h===""||h==="contact"){e.preventDefault();goContact()}
});
window.addEventListener("hashchange",route);route();
app.addEventListener("click",function(e){var b=e.target.closest("button[data-f]");if(b){cur=b.dataset.f;var y=scrollY;app.innerHTML=list();scrollTo(0,y)}});
/* image introuvable : retirée sans laisser d'icône cassée */
document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"){var f=t.closest("figure");(f||t).remove()}},true);
/* formulaire de contact */
app.addEventListener("submit",function(e){
if(e.target.id!=="cf")return;e.preventDefault();
var f=e.target,st=document.getElementById("cs"),btn=f.querySelector("button");
if(/VOTRE_ID/.test(FORM_ENDPOINT)){st.textContent="Le formulaire n'est pas encore activé.";return}
var d=Object.fromEntries(new FormData(f));
if(d._gotcha)return;
if(!f.checkValidity()){f.reportValidity();return}
btn.disabled=true;st.textContent="Envoi en cours…";
fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(d)})
.then(function(r){if(r.status===429){throw "rate"}if(!r.ok){throw "err"}f.reset();st.textContent="Merci ! Votre message a bien été envoyé."})
.catch(function(x){st.textContent=x==="rate"?"Trop de messages envoyés, merci de réessayer dans quelques instants.":"Une erreur est survenue. Veuillez réessayer plus tard."})
.then(function(){btn.disabled=false});
});
/* effet flottant au curseur */
document.addEventListener("pointermove",function(e){
if(e.pointerType!=="mouse")return;var c=e.target.closest&&e.target.closest(".tilt");if(!c)return;
var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
c.style.setProperty("--ry",((x-.5)*12).toFixed(2)+"deg");c.style.setProperty("--rx",((.5-y)*10).toFixed(2)+"deg");
c.style.setProperty("--mx",(x*100)+"%");c.style.setProperty("--my",(y*100)+"%");
});
document.addEventListener("pointerout",function(e){var c=e.target.closest&&e.target.closest(".tilt");if(c&&!c.contains(e.relatedTarget)){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}});
</script>
