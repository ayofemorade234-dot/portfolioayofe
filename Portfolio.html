function hx(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function initAI(){
document.body.insertAdjacentHTML("beforeend",'<button id="ai" type="button" aria-label="Ouvrir l\'assistant" aria-expanded="false" aria-controls="aip"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+UI.sparkle+'</svg></button><section id="aip" role="dialog" aria-label="Assistant du portfolio" hidden><div class="ah"><div><strong>Assistant du portfolio</strong><small>Réponses basées sur le contenu de ce site</small></div><button id="aix" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+UI.close+'</svg></button></div><div id="am" role="log" aria-live="polite"></div><div id="ach"></div><form id="af"><input id="aq" type="text" placeholder="Posez une ou plusieurs questions…" autocomplete="off" maxlength="300" aria-label="Votre question"><button type="submit" aria-label="Envoyer"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+UI.send+'</svg></button></form></section>');
var b=document.getElementById("ai"),p=document.getElementById("aip"),m=document.getElementById("am"),f=document.getElementById("af"),qi=document.getElementById("aq"),ch=document.getElementById("ach"),on=false,busy=false;
function chips(){ch.innerHTML=sugg().map(function(x){return '<button type="button" data-q="'+hx(x[1])+'">'+hx(x[0])+'</button>'}).join("")}
function add(c,h){var d=document.createElement("div");d.className="m "+c;d.innerHTML=h;m.appendChild(d);m.scrollTop=m.scrollHeight;return d}
function ask(t){if(busy)return;busy=true;add("u",hx(t));var d=add("b",'<span class="dots"><span></span><span></span><span></span></span>'),r;try{r=answer(t)}catch(e){r="Une erreur est survenue ; reformulez votre question, s'il vous plaît."}
setTimeout(function(){d.innerHTML=r;m.scrollTop=m.scrollHeight;chips();busy=false},Math.min(250+r.length/4,800))}
function toggle(o){p.hidden=!o;b.setAttribute("aria-expanded",String(o));if(o){if(!on){on=true;add("b","Bonjour ! Je suis l'assistant de ce portfolio. Posez-moi <strong>une ou plusieurs questions</strong> sur le parcours, les expériences, les compétences ou les projets de Morade. Tapez « aide » pour voir des exemples.");chips()}qi.focus()}}
b.addEventListener("click",function(){toggle(p.hidden)});
document.getElementById("aix").addEventListener("click",function(){toggle(false);b.focus()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!p.hidden)toggle(false)});
f.addEventListener("submit",function(e){e.preventDefault();var t=qi.value.trim();if(t){qi.value="";ask(t)}});
ch.addEventListener("click",function(e){var c=e.target.closest("button");if(c)ask(c.getAttribute("data-q"))});
m.addEventListener("click",function(e){if(e.target.closest("a")&&innerWidth<600)toggle(false)});
}
initAI();

app.addEventListener("submit",function(e){
if(e.target.id!=="cf")return;e.preventDefault();
var f=e.target,st=document.getElementById("cs"),btn=f.querySelector("button");
if(/VOTRE_ID/.test(FORM_ENDPOINT)){st.textContent="Le formulaire n'est pas encore activé.";return}

btn.disabled=true;st.textContent="Envoi en cours…";

.then(function(r){if(r.status===429){throw "rate"}if(!r.ok){throw "err"}f.reset();st.textContent="Merci ! Votre message a bien été envoyé."})
.catch(function(x){st.textContent=x==="rate"?"Trop de messages envoyés, merci de réessayer dans quelques instants.":"Une erreur est survenue. Veuillez réessayer plus tard."})
.then(function(){btn.disabled=false});
});
/* effet flottant au curseur */
document.addEventListener("pointermove",function(e){
if(e.pointerType!=="mouse")return;var c=e.target.closest&&e.target.closest(".tilt");if(!c)return;
var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
c.style.setProperty("--ry",((x-.5)*12).toFixed(2)+"deg");c.style.setProperty("--rx",((.5-y)*10).toFixed(2)+"deg");
c.style.setProperty("--mx",(x*100)+"%");c.style.setProperty("--my",(y*100)+"%");
});
document.addEventListener("pointerout",function(e){var c=e.target.closest&&e.target.closest(".tilt");if(c&&!c.contains(e.relatedTarget)){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}});
</script>
